name: Build and deploy PHP app to Azure Web App - kardex-web-unt

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-dev --optimize-autoloader

      - name: Create .env file
        run: |
          cat > .env << 'EOF'
          APP_NAME=Kardex
          APP_ENV=production
          APP_KEY=base64:/P1lRJetGkmyd2yfn5c36cal5Fw2UPFsggP5YjtKUvI=
          APP_DEBUG=true
          APP_URL=https://kardex-web-unt-ftaad6dgbedbhhcu.centralus-01.azurewebsites.net
          LOG_CHANNEL=stack
          LOG_LEVEL=debug
          DB_CONNECTION=sqlsrv
          DB_HOST=kardex-server-unt.database.windows.net
          DB_PORT=1433
          DB_DATABASE=KardexDB
          DB_USERNAME=admin_kardex
          DB_PASSWORD=Dbkdx105
          CACHE_DRIVER=file
          SESSION_DRIVER=file
          SESSION_LIFETIME=120
          QUEUE_CONNECTION=sync
          EOF

      - name: Fix document root
        run: |
          cp public/index.php index.php
          sed -i "s|__DIR__.'/../|__DIR__.'/public/../|g" index.php
          cp public/.htaccess .htaccess 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: php-app
          path: .

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: php-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_F0CF3588DBC9467595579E07873CCCA8 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_C69C65F84D044785A6D844B17CB038BB }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_A056B5A8424A4F95A000D446F7A2545E }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'kardex-web-unt'
          slot-name: 'Production'
          package: .
